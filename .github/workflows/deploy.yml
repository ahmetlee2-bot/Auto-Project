name: Build and publish AutoLister images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ahmetlee2-bot

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: autolister-frontend
            context: ./frontend
            file: ./frontend/Dockerfile.production
          - name: autolister-api
            context: ./backend
            file: ./backend/Dockerfile
          - name: autolister-ebay-bridge
            context: ./amazon-ebay-extension
            file: ./amazon-ebay-extension/Dockerfile.bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Load public Supabase client configuration
        if: matrix.name == 'autolister-frontend'
        id: supabase
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://api.autolister-app.de/api/v1/auth/config \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("url") and d.get("publishableKey"); print("supabase_url=" + d["url"]); print("publishable_key=" + d["publishableKey"])' \
            >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.supabase.outputs.supabase_url }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ steps.supabase.outputs.publishable_key }}
