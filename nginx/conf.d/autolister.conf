map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

server {
  listen 80;
  server_name autolister-app.de www.autolister-app.de api.autolister-app.de
              n8n.autolister-app.de status.autolister-app.de analytics.autolister-app.de;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name autolister-app.de www.autolister-app.de;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  location ^~ /api/cron/ { return 404; }
  location ^~ /api/internal/ { return 404; }
  location ^~ /api/tracked-products {
    proxy_pass http://frontend:3000;
    proxy_read_timeout 300s;
    include /etc/nginx/conf.d/proxy_params;
  }
  location = /api/lead {
    proxy_pass http://frontend:3000;
    include /etc/nginx/conf.d/proxy_params;
  }
  location / {
    proxy_pass http://frontend:3000;
    include /etc/nginx/conf.d/proxy_params;
  }
}

server {
  listen 443 ssl http2;
  server_name api.autolister-app.de;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 30m;
  location / {
    limit_req zone=api_per_ip burst=30 nodelay;
    proxy_pass http://api:3000;
    include /etc/nginx/conf.d/proxy_params;
  }
}

server {
  listen 443 ssl http2;
  server_name n8n.autolister-app.de;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  location / {
    proxy_pass http://n8n:5678;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/proxy_params;
  }
}

server {
  listen 443 ssl http2;
  server_name status.autolister-app.de;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  location / {
    proxy_pass http://uptime-kuma:3001;
    include /etc/nginx/conf.d/proxy_params;
  }
}

server {
  listen 443 ssl http2;
  server_name analytics.autolister-app.de;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  location / {
    proxy_pass http://umami:3000;
    include /etc/nginx/conf.d/proxy_params;
  }
}
