server {
    listen 80;
    server_name autolister-app.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name autolister-app.de;

    ssl_certificate /etc/letsencrypt/live/autolister-app.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autolister-app.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.autolister-app.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.autolister-app.de;

    ssl_certificate /etc/letsencrypt/live/api.autolister-app.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.autolister-app.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
